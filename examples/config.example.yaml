# StealthInterview - Example Configuration
# Copy this to config/config.yaml and modify as needed

stt:
  engine: "whisper"
  model: "base"
  language: "en"
  device: "cpu"

llm:
  provider: "ollama"
  model: "llama3.2:3b"
  base_url: "http://localhost:11434"
  temperature: 0.7

generator:
  response_speed: "fast"
  answer_length: "medium"
  technical_detail: "high"
  format: "behavioral"

stealth:
  enabled: true
  opacity: 0.85
  position: "top_right"
  width: 400
  height: 300

api:
  host: "0.0.0.0"
  port: 8000
  debug: false

security:
  encryption: true
  anonymize_logs: true
  no_logging: true